<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Information Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-8 text-gray-800">Movie Information Hub</h1>
        
        <!-- Search Section -->
        <div class="max-w-2xl mx-auto mb-8">
            <div class="relative">
                <input type="text" id="movieSearch" placeholder="Search for a movie..." 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="searchBtn" class="absolute right-3 top-1/2 transform -translate-y-1/2">
                    <i class="bi bi-search text-gray-500"></i>
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loader" class="hidden flex justify-center my-8">
            <div class="loader"></div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
            <!-- Results will be populated here -->
        </div>

        <!-- Movie Details -->
        <div id="movieDetails" class="hidden max-w-3xl mx-auto bg-white rounded-lg shadow-lg p-6">
            <!-- Movie details will be populated here -->
        </div>
    </div>

    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c'; // For demo purposes
        const searchInput = document.getElementById('movieSearch');
        const searchResults = document.getElementById('searchResults');
        const movieDetails = document.getElementById('movieDetails');
        const loader = document.getElementById('loader');

        // Convert to INR
        function convertToINR(usd) {
            const rate = 83; // Approximate USD to INR rate
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR'
            }).format(usd * rate);
        }

        async function searchMovies(query) {
            if (!query) return;
            
            loader.classList.remove('hidden');
            searchResults.innerHTML = '';
            movieDetails.classList.add('hidden');

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                data.results.forEach(movie => {
                    const movieCard = document.createElement('div');
                    movieCard.className = 'bg-white rounded-lg shadow-md p-4 cursor-pointer hover:shadow-lg transition-shadow';
                    movieCard.innerHTML = `
                        <h3 class="font-semibold text-lg mb-2">${movie.title}</h3>
                        <p class="text-gray-600">${movie.release_date}</p>
                    `;
                    movieCard.onclick = () => getMovieDetails(movie.id);
                    searchResults.appendChild(movieCard);
                });
            } catch (error) {
                console.error('Error:', error);
                searchResults.innerHTML = '<p class="text-red-500">An error occurred while searching for movies.</p>';
            } finally {
                loader.classList.add('hidden');
            }
        }

        async function getMovieDetails(movieId) {
            loader.classList.remove('hidden');
            movieDetails.classList.add('hidden');

            try {
                const response = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${API_KEY}`);
                const movie = await response.json();

                movieDetails.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">${movie.title}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <p class="mb-2"><span class="font-semibold">Release Date:</span> ${movie.release_date}</p>
                            <p class="mb-2"><span class="font-semibold">Language:</span> ${movie.original_language.toUpperCase()}</p>
                            <p class="mb-2"><span class="font-semibold">Budget:</span> ${convertToINR(movie.budget)}</p>
                            <p class="mb-2"><span class="font-semibold">Box Office (Worldwide):</span> ${convertToINR(movie.revenue)}</p>
                        </div>
                        <div class="text-sm text-gray-600">
                            <h3 class="font-semibold mb-2">Overview:</h3>
                            <p>${movie.overview}</p>
                        </div>
                    </div>
                `;
                movieDetails.classList.remove('hidden');
                movieDetails.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Error:', error);
                movieDetails.innerHTML = '<p class="text-red-500">An error occurred while fetching movie details.</p>';
                movieDetails.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        }

        // Event Listeners
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchMovies(searchInput.value);
            }
        });

        document.getElementById('searchBtn').addEventListener('click', () => {
            searchMovies(searchInput.value);
        });

        // Debounce search for better performance
        let debounceTimer;
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                searchMovies(searchInput.value);
            }, 500);
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
